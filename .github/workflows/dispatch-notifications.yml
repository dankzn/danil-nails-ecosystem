name: Dispatch notifications

# apps/api runs as a Vercel serverless function (no persistent process of
# its own), so something external has to periodically trigger the
# notification queue drain. This pings the secured endpoint every 5
# minutes — GitHub Actions' shortest supported cron interval — which is
# well within the slack of the client-facing reminder timing (1 hour
# before an appointment).
#
# Repository secrets required (Settings → Secrets and variables → Actions):
#   NOTIFICATIONS_DISPATCH_URL    e.g. https://<api-domain>/v1/internal/notifications/dispatch
#   NOTIFICATIONS_DISPATCH_SECRET must match NOTIFICATIONS_DISPATCH_SECRET set on the API project

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ping notification dispatch endpoint
        run: |
          curl -fsS --retry 2 --retry-delay 5 -X POST "$NOTIFICATIONS_DISPATCH_URL" \
            -H "x-dispatch-secret: $NOTIFICATIONS_DISPATCH_SECRET"
        env:
          NOTIFICATIONS_DISPATCH_URL: ${{ secrets.NOTIFICATIONS_DISPATCH_URL }}
          NOTIFICATIONS_DISPATCH_SECRET: ${{ secrets.NOTIFICATIONS_DISPATCH_SECRET }}
